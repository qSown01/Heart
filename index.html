<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Glowing Heart Animation</title>

  <!-- 1. Dùng thẻ <link> để nhúng file CSS vào trang -->
  <!-- 'rel="stylesheet"' báo cho trình duyệt biết đây là file định kiểu giao diện -->
  <!-- 'href="style.css"' là đường dẫn tương đối tới file css nằm cùng thư mục -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Khung vẽ Canvas -->
  <canvas id="heartCanvas"></canvas>

  <!-- 2. Dùng thẻ <script> với thuộc tính 'src' để nạp file JavaScript -->
  <!-- Đặt ở cuối thẻ <body> để đảm bảo giao diện (HTML) được tải xong xuôi trước khi code JS bắt đầu chạy -->
  <script src="script.js"></script>
</body>
</html>
