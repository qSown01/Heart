<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="70%" stop-color="#291102"/>
      <stop offset="100%" stop-color="#1c0b02"/>
    </radialGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#b45309" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <g transform="translate(32, 32)">
      <!-- 12 back petals -->
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(15)"/>
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(45)"/>
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(75)"/>
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(105)"/>
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(135)"/>
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(165)"/>
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(195)"/>
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(225)"/>
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(255)"/>
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(285)"/>
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(315)"/>
      <path d="M 0 -7 C -4.5 -16 -4 -28 0 -31 C 4 -28 4.5 -16 0 -7 Z" fill="url(#petalGrad2)" transform="rotate(345)"/>

      <!-- 12 front petals -->
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(0)"/>
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(30)"/>
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(60)"/>
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(90)"/>
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(120)"/>
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(150)"/>
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(180)"/>
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(210)"/>
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(240)"/>
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(270)"/>
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(300)"/>
      <path d="M 0 -6 C -5 -15 -4.5 -28 0 -30 C 4.5 -28 5 -15 0 -6 Z" fill="url(#petalGrad1)" transform="rotate(330)"/>

      <!-- Center Disc -->
      <circle cx="0" cy="0" r="11" fill="url(#centerGrad)"/>
      <circle cx="0" cy="0" r="10.5" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="#92400e" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>
      <circle cx="0" cy="0" r="4.5" fill="none" stroke="#78350f" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>
